<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Missed Call Agent</title>
    <script>
      // GitHub Pages SPA routing: redirect all 404s back to index.html,
      // encoding the path as a query param so index.html can restore it.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?p=' + encodeURIComponent(l.pathname + l.search) + l.hash
      );
    </script>
  </head>
  <body></body>
</html>
