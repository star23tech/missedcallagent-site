# /etc/nginx/sites-available/missedcallagent
# Symlink to sites-enabled:
#   sudo ln -s /etc/nginx/sites-available/missedcallagent /etc/nginx/sites-enabled/
#
# After setting up this file, run certbot to add HTTPS:
#   sudo certbot --nginx -d yourdomain.com

server {
    listen 80;
    server_name yourdomain.com;

    # Serve the built React app
    root /home/ubuntu/missedcallagent-site/frontend/dist;
    index index.html;

    # React router — fall back to index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to uvicorn
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
